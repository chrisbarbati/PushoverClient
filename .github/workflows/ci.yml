name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      project-version: ${{ steps.project-version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve project version
        id: project-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout | grep -E '^[0-9A-Za-z._-]+$' | tail -n 1)"
          if [[ -z "${version}" ]]; then
            echo "Could not resolve project version" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved project version: ${version}"

      - name: Verify build
        run: mvn -B verify

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          project_version='${{ steps.project-version.outputs.value }}'
          mkdir -p release-assets
          for module in pushover-client pushover-client-servlet pushover-client-jetty pushover-client-tomcat; do
            artifact_path="${module}/target/${module}-${project_version}.jar"
            if [[ ! -f "${artifact_path}" ]]; then
              echo "Expected release artifact not found: ${artifact_path}" >&2
              exit 1
            fi
            cp "${artifact_path}" release-assets/
          done
          find release-assets -maxdepth 1 -type f -name '*.jar' -print | sort

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: maven-jars
          if-no-files-found: error
          path: release-assets/*.jar

  publish-releases:
    name: publish-releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v${{ needs.verify.outputs.project-version }}
      ROLLING_TAG: rolling-main-prerelease
      PROJECT_VERSION: ${{ needs.verify.outputs.project-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested jars
        uses: actions/download-artifact@v4
        with:
          name: maven-jars
          path: release-assets

      - name: Show release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -name '*.jar' -print | sort

      - name: Move stable release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${RELEASE_TAG}" -m "Release ${PROJECT_VERSION} for ${GITHUB_SHA}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.PROJECT_VERSION }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*.jar
          body: |
            Automated stable release for revision `${{ env.PROJECT_VERSION }}` from `main`.

            - Tag: `${{ env.RELEASE_TAG }}`
            - Commit: `${{ github.sha }}`
            - Assets: tested reactor JARs from the `verify` job

            If `main` is rebuilt without a revision bump, this versioned release is refreshed in place and its assets are overwritten.

      - name: Move rolling prerelease tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${ROLLING_TAG}" -m "Rolling prerelease for ${GITHUB_SHA}" "${GITHUB_SHA}"
          git push origin "refs/tags/${ROLLING_TAG}" --force

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ROLLING_TAG }}
          name: Rolling prerelease main (${{ env.PROJECT_VERSION }})
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*.jar
          body: |
            Automated moving prerelease feed for the latest successful push to `main`.

            - Version: `${{ env.PROJECT_VERSION }}`
            - Tag: `${{ env.ROLLING_TAG }}`
            - Commit: `${{ github.sha }}`
            - Assets: tested reactor JARs from the `verify` job

            This prerelease is intentionally separate from the stable `v${{ env.PROJECT_VERSION }}` release so consumers can choose between version-labeled releases and a moving latest-main feed.

